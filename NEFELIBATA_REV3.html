<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEFELIBATA PERPETUA</title>
    <style>
        :root {
            /* Path logic: Start at center (0,0), move left by radius (320), then draw arc */
            --path: path("M 0,0 m -320, 0 a 320,180 0 1,0 640,0 a 320,180 0 1,0 -640,0");
            --speed: 35s;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #ffffff;
            font-family: 'Helvetica', 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 640px; 
            height: 640px;
            cursor: pointer; /* Shows the hand pointer initially */
        }

        .logo {
            position: relative;
            width: 450px; 
            height: 450px;
            z-index: 1; /* Lowered so it sits BEHIND the text */
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .logo img {
            max-width: 100%;
            height: auto;
        }

        .char {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 10; /* Raised to ensure text stays ON TOP of the image */
            
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #333;
            white-space: nowrap;
            
            offset-path: var(--path);
            offset-rotate: 0deg; 
            
            animation: move var(--speed) linear infinite;
        }

        @keyframes move {
            0% { offset-distance: 100%; }
            100% { offset-distance: 0%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img id="logo-img" src="assets/LOGO crop_NEFELIBATA.png" alt="Logo">
    </div>
    
    <div id="slogan-container"></div>
</div>

<script>
    const slogan = "nefelibata is a multi-disciplinar curated archive of works by an orbital network of individuals ❊ open-access space of autonomy-freedom • ";
    const sloganContainer = document.getElementById('slogan-container');
    const logoImg = document.getElementById('logo-img');
    const mainContainer = document.querySelector('.container');
    
    const reversedLetters = slogan.split('').reverse();
    const totalChars = reversedLetters.length;

    reversedLetters.forEach((char, i) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerText = char === " " ? "\u00A0" : char;
        
        span.style.animationDelay = `calc((${i} / ${totalChars}) * -${getComputedStyle(document.documentElement).getPropertyValue('--speed')})`;
        
        sloganContainer.appendChild(span);
    });

    // The { once: true } ensures this click action only happens exactly one time
    mainContainer.addEventListener('click', () => {
        logoImg.src = 'assets/LOGO crop_NEFELIBATA PERPETUA.png';
        mainContainer.style.cursor = 'default'; // Removes the clickable pointer hand
    }, { once: true });
</script>

</body>
</html>
