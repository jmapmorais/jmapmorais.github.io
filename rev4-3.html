<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEFELIBATA PERPETUA</title>
    <style>
        :root {
            /* Path logic: Start at center (0,0), move left by radius (320), then draw arc */
            --path: path("M 0,0 m -320, 0 a 320,180 0 1,0 640,0 a 320,180 0 1,0 -640,0");
            --speed: 35s;
            
            /* --- THE MASTER FADE SPEED --- */
            --fade-speed: 0.7s; 
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'Helvetica', 'Arial', sans-serif;
            overflow: hidden; /* Locks scrolling before the click */
        }

        /* --- THE ARTWORK (Locked to the background) --- */
        .container {
            position: fixed; /* Locks the circle to the screen */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Perfectly centers it */
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 640px; 
            height: 640px;
            cursor: pointer; 
            z-index: 1; /* Keeps it behind the text */
        }

        .logo {
            position: relative;
            width: 450px; 
            height: 450px;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        /* Scales ONLY the logo image on smaller screens */
        @media (max-width: 1125px) {
            .logo {
                transform: scale(calc(100vw / 1125));
            }
        }

        /* --- SYNCHRONIZED IMAGE CROSSFADE --- */
        .logo img {
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); 
            max-width: 100%; height: auto;
            transition: opacity var(--fade-speed) ease; 
        }

        #logo-img-overlay { opacity: 0; }
        .logo.swapped #logo-img-base { opacity: 0; }
        .logo.swapped #logo-img-overlay { opacity: 1; }

        .char {
            position: absolute;
            top: 50%; left: 50%;
            z-index: 10; 
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #333;
            white-space: nowrap;
            offset-path: var(--path);
            offset-rotate: 0deg; 
            animation: move var(--speed) linear infinite;
        }

        @keyframes move {
            0% { offset-distance: 100%; }
            100% { offset-distance: 0%; }
        }

        /* --- THE FOREGROUND TEXT OVERLAY --- */
        .content-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            z-index: 20; /* Sits on top of the container */
            pointer-events: none; /* Lets you click 'through' to the logo initially */
        }

        .hidden-text {
            width: 90%;
            max-width: 800px;
            margin-top: 10vh; /* Spacing from the top of the screen */
            margin-bottom: 10vh; /* Spacing at the bottom so you can scroll past it */
            padding: 40px;
            
            /* The Readable White Background */
            background-color: rgba(255, 255, 255, 0.92); /* 92% opaque white */
            backdrop-filter: blur(4px); /* Gently blurs the image behind it */
            -webkit-backdrop-filter: blur(4px); /* Safari support */
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); /* Subtle edge separation */
            
            text-align: center;
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            
            /* Hidden state */
            opacity: 0; 
            transform: translateY(20px); /* Creates a slight "slide up" effect as it fades */
            transition: opacity var(--fade-speed) ease, transform var(--fade-speed) ease;
        }

        /* Visible state applied by JavaScript */
        .hidden-text.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto; /* Becomes interactable/scrollable once visible */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img id="logo-img-base" src="assets/LOGO crop_NEFELIBATA.png" alt="Logo">
        <img id="logo-img-overlay" src="assets/LOGO crop_NEFELIBATA PERPETUA.png" alt="Logo Perpetua">
    </div>
    
    <div id="slogan-container"></div>
</div>

<div class="content-wrapper">
    <div id="emerging-text" class="hidden-text">
        This is where your text from nefelibata-test.html will appear.<br><br>
        Because this layer is now set up to scroll, you can paste the entire long list of artists and archive details in here, and it will format perfectly over the spinning background!
    </div>
</div>

<script>
    const slogan = "nefelibata is a multi-disciplinar curated archive of works by an orbital network of individuals ❊ open-access space of autonomy-freedom • ";
    const sloganContainer = document.getElementById('slogan-container');
    const logoContainer = document.querySelector('.logo');
    const mainContainer = document.querySelector('.container');
    const emergingText = document.getElementById('emerging-text'); 
    
    const reversedLetters = slogan.split('').reverse();
    const totalChars = reversedLetters.length;

    reversedLetters.forEach((char, i) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerText = char === " " ? "\u00A0" : char;
        
        span.style.animationDelay = `calc((${i} / ${totalChars}) * -${getComputedStyle(document.documentElement).getPropertyValue('--speed')})`;
        
        sloganContainer.appendChild(span);
    });

    // The { once: true } ensures this click action only happens exactly one time
    mainContainer.addEventListener('click', () => {
        // 1. Triggers the CSS image crossfade
        logoContainer.classList.add('swapped');
        
        // 2. Removes the clickable pointer hand
        mainContainer.style.cursor = 'default'; 

        // 3. Unlocks the page so the user can scroll through the long text
        document.body.style.overflowY = 'auto';

        // 4. Fades in the new text at the top of the page
        emergingText.classList.add('visible');
    }, { once: true });
</script>

</body>
</html>
